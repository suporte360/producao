{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
<h2><i class="fas fa-user-edit"></i> Editar Usuário</h2>
<form method="POST">
    <div class="form-group">
        <label>Usuário (Login) *</label>
        <input type="text" class="form-control" value="{{ usuario.usuario }}" disabled>
        <small>Nome de usuário para login (não pode ser alterado)</small>
    </div>
    
    <div class="form-group">
        <label>Nome Completo *</label>
        <input type="text" name="nome" class="form-control" value="{{ usuario.nome }}" required>
    </div>
    
    <div class="form-group">
        <label>E-mail</label>
        <input type="email" name="email" class="form-control" value="{{ usuario.email if usuario.email else '' }}">
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label>Nível de Acesso *</label>
                <select name="perfil" class="form-control" required>
                    <option value="operador" {% if usuario.perfil == 'operador' %}selected{% endif %}>Operador</option>
                    <option value="encarregado" {% if usuario.perfil == 'encarregado' %}selected{% endif %}>Encarregado</option>
                    <option value="admin" {% if usuario.perfil == 'admin' %}selected{% endif %}>Administrador</option>
                </select>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group">
                <label>Departamento</label>
                <select name="departamento" class="form-control">
                    <option value="">Nenhum (Todos)</option>
                    <option value="SOLDAR" {% if usuario.departamento == 'SOLDAR' %}selected{% endif %}>SOLDAR</option>
                    <option value="TRATAMENTO DE SOLDA" {% if usuario.departamento == 'TRATAMENTO DE SOLDA' %}selected{% endif %}>TRATAMENTO DE SOLDA</option>
                    <option value="POLIMENTO" {% if usuario.departamento == 'POLIMENTO' %}selected{% endif %}>POLIMENTO</option>
                    <option value="MONTAGEM" {% if usuario.departamento == 'MONTAGEM' %}selected{% endif %}>MONTAGEM</option>
                    <option value="EMBALAR" {% if usuario.departamento == 'EMBALAR' %}selected{% endif %}>EMBALAR</option>
                </select>
                <small>Operadores devem ter um departamento</small>
            </div>
        </div>
    </div>
    
    <hr>
    <h5>Alterar Senha</h5>
    <div class="form-group">
        <label>Nova Senha</label>
        <input type="password" name="senha" class="form-control" placeholder="Deixe em branco para manter a senha atual">
    </div>
    
    <div class="form-group">
        <label>Status</label>
        <select name="ativo" class="form-control">
            <option value="1" {% if usuario.ativo == 1 %}selected{% endif %}>Ativo</option>
            <option value="0" {% if usuario.ativo == 0 %}selected{% endif %}>Inativo</option>
        </select>
    </div>
    
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{{ url_for('admin_usuarios') }}" class="btn btn-secondary">Cancelar</a>
</form>
</div>
{% endblock %}
