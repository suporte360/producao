{% extends "base.html" %}
{% block title %}Sem Departamento{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="bi bi-exclamation-triangle text-warning" style="font-size:4rem"></i>
    <h3 class="mt-3">Departamento nao configurado</h3>
    <p class="text-muted">Seu usuario nao esta associado a nenhum departamento.<br>Entre em contato com o administrador do sistema.</p>
    <a href="{{ url_for('logout') }}" class="btn btn-outline-secondary mt-2">
        <i class="bi bi-box-arrow-right me-1"></i>Sair
    </a>
</div>
{% endblock %}
