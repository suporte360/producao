<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Almoxarifado — SALUTEM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg:     #050e0f;
      --bg2:    #091618;
      --bg3:    #0d1e20;
      --border: rgba(255,255,255,0.06);
      --text:   #dff6f5;
      --muted:  #4a7070;
      --teal:   #0d9488;
      --cyan:   #22d3ee;
      --green:  #22c55e;
      --amber:  #f59e0b;
      --red:    #ef4444;
      --purple: #a855f7;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(13,148,136,0.08) 0, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(34,211,238,0.06) 0, transparent 40%);
      pointer-events: none; z-index: 0;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(90deg,#050f10 0%,#091e20 55%,#050f10 100%);
      border-bottom: 1px solid rgba(13,148,136,.35);
      padding: 0 24px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; position: relative; z-index: 2;
    }
    .h-left { display:flex; align-items:center; gap:14px; }
    .h-logo {
      width:42px; height:42px; border-radius:10px;
      background: var(--teal);
      display:flex; align-items:center; justify-content:center; font-size:1.3rem;
      box-shadow: 0 0 20px rgba(13,148,136,0.4);
    }
    .h-title { font-size:1.3rem; font-weight:800; letter-spacing:.02em; }
    .h-title span { color:var(--cyan); }
    .h-sub { font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:1px; }
    .h-clock .time { font-size:1.9rem; font-weight:700; font-family:'Courier New',monospace; color:var(--cyan); line-height:1; text-align:right; text-shadow: 0 0 12px rgba(34,211,238,0.4); }
    .h-clock .date { font-size:.7rem; color:var(--muted); margin-top:2px; text-align:right; text-transform:capitalize; }

    /* ── STATS ── */
    .stats-bar {
      display:grid; grid-template-columns:repeat(5,1fr);
      gap:8px; padding:10px 16px; flex-shrink:0;
      position: relative; z-index: 2;
    }
    .stat-card {
      background: var(--bg2); border:1px solid var(--border);
      border-radius:10px; padding:12px 16px;
      display:flex; align-items:center; gap:12px;
      transition: all .2s;
    }
    .stat-card.pulse-alert { animation: pulseCard 1.5s infinite; }
    @keyframes pulseCard {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); border-color: rgba(239,68,68,0.5); }
      50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); border-color: rgba(239,68,68,1); }
    }
    .stat-icon {
      width:40px; height:40px; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      font-size:1.1rem; flex-shrink:0;
    }
    .stat-num { font-size:1.8rem; font-weight:800; line-height:1; }
    .stat-lbl { font-size:.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

    /* ── PAINÉIS ── */
    .main-grid {
      flex:1; display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px; padding:0 16px 8px;
      overflow:hidden;
      position: relative; z-index: 2;
    }
    .panel {
      background: var(--bg2); border:1px solid var(--border);
      border-radius:12px; display:flex; flex-direction:column;
      overflow:hidden;
    }
    .panel-header {
      padding:10px 14px;
      font-size:.78rem; font-weight:800;
      text-transform:uppercase; letter-spacing:.07em;
      display:flex; justify-content:space-between; align-items:center;
      flex-shrink:0; border-bottom:1px solid var(--border);
    }
    .panel-body { flex:1; overflow-y:auto; }
    .panel-body::-webkit-scrollbar { width:4px; }
    .panel-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:3px; }

    .panel-sep    { border-top:3px solid var(--teal); }
    .panel-estoque { border-top:3px solid var(--amber); }
    .panel-sep    .panel-header { color:var(--cyan); }
    .panel-estoque .panel-header { color:var(--amber); }

    /* ── CARD DE OP (separação) ── */
    .op-card {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background .2s;
    }
    .op-card:hover { background: rgba(255,255,255,0.02); }
    .op-card.urgente { background: rgba(239,68,68,0.08); border-left: 3px solid var(--red); }
    .op-card.atrasada { background: rgba(239,68,68,0.12); }
    .op-card.separado { background: rgba(34,197,94,0.06); border-left: 3px solid var(--green); }
    .op-card.separando { background: rgba(34,211,238,0.06); border-left: 3px solid var(--cyan); }

    .op-num { font-size:1.1rem; font-weight:800; color:#60a5fa; min-width: 50px; }
    .op-num small { display:block; font-size:.65rem; color:var(--muted); font-weight:400; }
    .op-info { min-width: 0; }
    .op-prod { font-size:.85rem; font-weight:600; color:#e2e8f0; line-height:1.3; }
    .op-meta { display:flex; gap:8px; flex-wrap:wrap; margin-top:3px; }
    .op-qtd { font-size:.7rem; color:var(--muted); }
    .op-dept { font-size:.6rem; padding:1px 7px; border-radius:7px; background:rgba(255,255,255,0.08); color:#94a3b8; font-weight:600; }

    .op-status-badge {
      font-size:.55rem; font-weight:800; text-transform:uppercase;
      padding:3px 9px; border-radius:8px; letter-spacing:.05em; white-space:nowrap;
    }
    .op-status-badge.pendente   { background:#1e3a5f; color:#60a5fa; }
    .op-status-badge.separando  { background:#0e7490; color:#67e8f9; }
    .op-status-badge.separado   { background:#14532d; color:#86efac; }
    .op-status-badge.entregue   { background:#1f2937; color:#9ca3af; }

    .op-priority {
      font-size:.55rem; font-weight:800; text-transform:uppercase;
      padding:3px 8px; border-radius:8px; letter-spacing:.05em;
    }
    .op-priority.urgente { background:#7f1d1d; color:#fca5a5; }
    .op-priority.alta    { background:#7c2d12; color:#fdba74; }
    .op-priority.media   { background:#713f12; color:#fde68a; }
    .op-priority.baixa   { background:#14532d; color:#86efac; }

    .op-progress { width: 70px; display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
    .op-progress-bar { width:100%; height:6px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; }
    .op-progress-fill { height:100%; border-radius:3px; transition:width .5s; }

    .cnt-badge {
      background:rgba(255,255,255,0.1); color:var(--text);
      font-size:.65rem; font-weight:700;
      padding:2px 9px; border-radius:10px;
    }

    /* ── TABELA ESTOQUE ── */
    .tbl-estoque { width:100%; border-collapse:collapse; table-layout:fixed; }
    .tbl-estoque thead th {
      padding:9px 12px; font-size:.65rem;
      text-transform:uppercase; letter-spacing:.06em;
      color:var(--muted); background:rgba(255,255,255,0.02);
      border-bottom:1px solid var(--border);
      white-space:nowrap; position:sticky; top:0; z-index:2;
      text-align: left;
    }
    .tbl-estoque thead th:nth-child(3),
    .tbl-estoque thead th:nth-child(4) { text-align:right; }
    .tbl-estoque tbody td {
      padding:9px 12px; font-size:.82rem;
      border-bottom:1px solid rgba(255,255,255,0.03);
      vertical-align:middle;
    }
    .tbl-estoque tbody tr:hover td { background:rgba(255,255,255,0.02); }

    .est-codigo { font-family:'Courier New',monospace; font-size:.78rem; color:#60a5fa; font-weight:600; }
    .est-desc { color:#e2e8f0; font-weight:500; }
    .est-saldo { font-weight:800; font-size:.95rem; }
    .est-min { color:var(--muted); font-size:.75rem; }

    .est-row.CRITICO td { background:rgba(239,68,68,0.08); border-left:3px solid var(--red); }
    .est-row.BAIXO td   { background:rgba(245,158,11,0.06); border-left:3px solid var(--amber); }
    .est-row.OK td      { border-left:3px solid rgba(34,197,94,0.3); }

    .est-status {
      font-size:.55rem; font-weight:800; text-transform:uppercase;
      padding:2px 8px; border-radius:6px; letter-spacing:.04em; white-space:nowrap;
    }
    .est-status.CRITICO { background:#7f1d1d; color:#fca5a5; }
    .est-status.BAIXO   { background:#713f12; color:#fde68a; }
    .est-status.OK      { background:#14532d; color:#86efac; }

    /* ── FOOTER ── */
    footer {
      height:30px; background:#040b0c;
      border-top:1px solid rgba(13,148,136,.25);
      display:flex; align-items:center;
      padding:0 16px; gap:12px; flex-shrink:0;
      position: relative; z-index: 2;
    }
    .live-dot { display:flex; align-items:center; gap:5px; font-size:.6rem; font-weight:700; color:#22c55e; white-space:nowrap; }
    .dot { width:6px; height:6px; border-radius:50%; background:#22c55e; animation:pulseDot 1.4s infinite; }
    @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.75)} }
    .ticker-msg { font-size:.65rem; color:#1e4040; }

    .empty-panel {
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      height:100%; color:#173030; gap:8px; font-size:.82rem;
    }
    .empty-panel i { font-size:2.2rem; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="h-left">
    <div class="h-logo"><i class="fa-solid fa-boxes-stacked"></i></div>
    <div>
      <div class="h-title">ALMOXARIFADO <span>Producao</span></div>
      <div class="h-sub">Separacao de Materiais e Estoque</div>
    </div>
  </div>
  <div class="h-clock">
    <div class="time" id="clock">00:00:00</div>
    <div class="date" id="dateStr">&#8212;</div>
  </div>
</header>

<!-- STATS -->
<div class="stats-bar">
  <div class="stat-card" id="cardPend">
    <div class="stat-icon" style="background:rgba(6,182,212,.15);color:#22d3ee">
      <i class="fa-solid fa-clipboard-list"></i>
    </div>
    <div>
      <div class="stat-num" style="color:#22d3ee" id="sPend">0</div>
      <div class="stat-lbl">Pendentes</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon" style="background:rgba(34,211,238,.15);color:#67e8f9">
      <i class="fa-solid fa-arrows-spin"></i>
    </div>
    <div>
      <div class="stat-num" style="color:#67e8f9" id="sSep">0</div>
      <div class="stat-lbl">Separando</div>
    </div>
  </div>
  <div class="stat-card" id="cardUrg">
    <div class="stat-icon" style="background:rgba(239,68,68,.15);color:#f87171">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <div>
      <div class="stat-num" style="color:#f87171" id="sUrg">0</div>
      <div class="stat-lbl">Urgentes</div>
    </div>
  </div>
  <div class="stat-card" id="cardCritico">
    <div class="stat-icon" style="background:rgba(239,68,68,.15);color:#f87171">
      <i class="fa-solid fa-circle-exclamation"></i>
    </div>
    <div>
      <div class="stat-num" style="color:#f87171" id="sCritico">0</div>
      <div class="stat-lbl">Estoque Critico</div>
    </div>
  </div>
  <div class="stat-card" id="cardBaixo">
    <div class="stat-icon" style="background:rgba(245,158,11,.15);color:#fbbf24">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <div>
      <div class="stat-num" style="color:#fbbf24" id="sBaixo">0</div>
      <div class="stat-lbl">Estoque Alerta</div>
    </div>
  </div>
</div>

<!-- PAINÉIS -->
<div class="main-grid">

  <!-- ESQUERDA: OPs Liberadas — Separação -->
  <div class="panel panel-sep">
    <div class="panel-header">
      <span><i class="fa-solid fa-boxes-stacked" style="margin-right:6px"></i>OPs Liberadas — Separacao</span>
      <span class="cnt-badge" id="cntLotes">0</span>
    </div>
    <div class="panel-body" id="painelLotes">
      <div class="empty-panel">
        <i class="fa-solid fa-rotate fa-spin"></i>
        <span>Carregando...</span>
      </div>
    </div>
  </div>

  <!-- DIREITA: Estoque do ERP -->
  <div class="panel panel-estoque">
    <div class="panel-header">
      <span><i class="fa-solid fa-warehouse" style="margin-right:6px"></i>Estoque do Almoxarifado</span>
      <span class="cnt-badge" id="cntEstoque">0</span>
    </div>
    <div class="panel-body" id="painelEstoque">
      <div class="empty-panel">
        <i class="fa-solid fa-rotate fa-spin"></i>
        <span>Carregando estoque...</span>
      </div>
    </div>
  </div>

</div>

<!-- FOOTER -->
<footer>
  <div class="live-dot"><div class="dot"></div> AO VIVO</div>
  <div class="ticker-msg" id="tickerMsg">Almoxarifado &#8212; Atualizacao automatica</div>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
    <span style="font-size:.55rem;color:var(--muted)">SYNC ERP</span>
    <div class="dot"></div>
  </div>
</footer>

<script>
/* ─── Relógio ── */
function tick() {
  var n = new Date();
  document.getElementById('clock').textContent = n.toLocaleTimeString('pt-BR');
  document.getElementById('dateStr').textContent = n.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}
setInterval(tick,1000); tick();

/* ─── Helpers ── */
function fmtData(v) {
  if (!v) return '\u2014';
  try {
    var d = new Date(v + (v.indexOf('T') >= 0 ? '' : 'T00:00:00'));
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  } catch(e) { return v; }
}

function badgePrio(p) {
  var pp = (p||'media').toLowerCase();
  return '<span class="op-priority ' + pp + '">' + (p||'MEDIA').toUpperCase() + '</span>';
}

function badgeSep(s) {
  var labels = {pendente:'Pendente', separando:'Separando', separado:'Separado', entregue:'Entregue'};
  return '<span class="op-status-badge ' + (s||'pendente') + '">' + (labels[s]||'Pendente') + '</span>';
}

function progBar(feitas, total) {
  if (!total) return '<span style="color:var(--muted);font-size:.65rem">\u2014</span>';
  var pct = Math.min(100, Math.round((feitas||0)/total*100));
  var cor = pct>=100?'#22c55e':pct>=50?'#f59e0b':'#3b82f6';
  return '<div class="op-progress"><div class="op-progress-bar"><div class="op-progress-fill" style="width:' + pct + '%;background:' + cor + '"></div></div><span style="font-size:.55rem;color:var(--muted)">' + pct + '%</span></div>';
}

/* ─── Auto-scroll suave (fractional accumulator) ── */
var scrollCol = null;
var scrollAccum = 0;
var scrollSpeed = 0.4;
var scrollDir = 1;

function autoScrollTick() {
  if (!scrollCol) return;
  var maxScroll = scrollCol.scrollHeight - scrollCol.clientHeight;
  if (maxScroll <= 0) return;
  scrollAccum += scrollSpeed * scrollDir;
  if (Math.abs(scrollAccum) >= 1) {
    scrollCol.scrollTop += Math.round(scrollAccum);
    scrollAccum = 0;
  }
  if (scrollCol.scrollTop >= maxScroll - 2) { scrollDir = -1; }
  else if (scrollCol.scrollTop <= 0) { scrollDir = 1; }
}

/* ─── Render OPs (cards de separação) ── */
function renderLotes(lotes) {
  var panel = document.getElementById('painelLotes');
  document.getElementById('cntLotes').textContent = lotes.length;
  if (!lotes.length) {
    panel.innerHTML = '<div class="empty-panel"><i class="fa-solid fa-circle-check" style="color:#14532d"></i><span>Nenhuma OP aguardando separacao</span></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < lotes.length; i++) {
    var l = lotes[i];
    var sepStatus = l.separacao_status || 'pendente';
    var prio = (l.prioridade||'media').toLowerCase();
    var urgente = prio === 'urgente' || prio === 'alta';
    var atrasada = (l.dias_atraso||0) > 0;
    var cls = 'op-card';
    if (urgente) cls += ' urgente';
    if (atrasada) cls += ' atrasada';
    if (sepStatus === 'separado') cls += ' separado';
    if (sepStatus === 'separando') cls += ' separando';

    html += '<div class="' + cls + '">' +
      '<div class="op-num">#' + l.ordem +
        (l.lote_codigo ? '<small>' + l.lote_codigo + '</small>' : '') +
      '</div>' +
      '<div class="op-info">' +
        '<div class="op-prod">' + (l.descricao_produto||'\u2014').substring(0,42) + '</div>' +
        '<div class="op-meta">' +
          '<span class="op-qtd"><i class="fa-solid fa-boxes-stacked" style="font-size:.6rem;margin-right:2px"></i>' + Math.round(l.qtde_ordem||0) + ' pc</span>' +
          (l.departamento_atual ? '<span class="op-dept">' + l.departamento_atual + '</span>' : '') +
          (atrasada ? '<span class="op-qtd" style="color:#f87171"><i class="fa-solid fa-circle-exclamation" style="font-size:.6rem;margin-right:2px"></i>' + l.dias_atraso + 'd atraso</span>' : '') +
          (l.data_previsao_erp ? '<span class="op-qtd"><i class="fa-regular fa-calendar" style="font-size:.6rem;margin-right:2px"></i>' + fmtData(l.data_previsao_erp) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end;">' +
        badgePrio(l.prioridade) +
        badgeSep(sepStatus) +
      '</div>' +
      progBar(l.operacoes_concluidas, l.total_operacoes) +
    '</div>';
  }
  panel.innerHTML = html;
}

/* ─── Render Estoque ── */
function renderEstoque(dados) {
  var panel = document.getElementById('painelEstoque');
  var produtos = dados.produtos || [];
  var stats = dados.stats || {};

  document.getElementById('sCritico').textContent = stats.CRITICO || 0;
  document.getElementById('sBaixo').textContent   = stats.BAIXO || 0;
  document.getElementById('cntEstoque').textContent = produtos.length;

  var cardCritico = document.getElementById('cardCritico');
  if ((stats.CRITICO || 0) > 0) cardCritico.classList.add('pulse-alert');
  else cardCritico.classList.remove('pulse-alert');

  var cardBaixo = document.getElementById('cardBaixo');
  if ((stats.BAIXO || 0) > 0) cardBaixo.classList.add('pulse-alert');
  else cardBaixo.classList.remove('pulse-alert');

  if (!produtos.length) {
    panel.innerHTML = '<div class="empty-panel"><i class="fa-solid fa-circle-check" style="color:#14532d"></i><span>Estoque vazio ou sem dados</span></div>';
    return;
  }

  var html = '<table class="tbl-estoque"><thead><tr>' +
    '<th style="width:16%">Codigo</th>' +
    '<th style="width:42%">Produto</th>' +
    '<th style="width:14%;text-align:right">Saldo</th>' +
    '<th style="width:14%;text-align:right">Min</th>' +
    '<th style="width:14%">Status</th>' +
    '</tr></thead><tbody>';

  for (var i = 0; i < produtos.length; i++) {
    var p = produtos[i];
    var corSaldo = p.status === 'CRITICO' ? '#f87171' : p.status === 'BAIXO' ? '#fbbf24' : '#4ade80';
    var statusLabel = p.status === 'CRITICO' ? 'CRITICO' : p.status === 'BAIXO' ? 'ALERTA' : 'OK';

    html += '<tr class="est-row ' + p.status + '">' +
      '<td class="est-codigo">' + p.codigo + '</td>' +
      '<td class="est-desc">' + p.descricao + '</td>' +
      '<td class="est-saldo" style="text-align:right;color:' + corSaldo + '">' + p.saldo + '</td>' +
      '<td class="est-min" style="text-align:right">' + p.minimo + '</td>' +
      '<td><span class="est-status ' + p.status + '">' + statusLabel + '</span></td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  panel.innerHTML = html;

  /* ativar auto-scroll no painel de estoque */
  scrollCol = document.getElementById('painelEstoque');
}

/* ─── Atualiza stats OPs ── */
function atualizarStats(stats) {
  document.getElementById('sPend').textContent = stats.pendentes || 0;
  document.getElementById('sSep').textContent  = stats.separando || 0;
  document.getElementById('sUrg').textContent  = stats.urgentes || 0;

  var cardUrg = document.getElementById('cardUrg');
  if ((stats.urgentes||0) > 0) cardUrg.classList.add('pulse-alert');
  else cardUrg.classList.remove('pulse-alert');

  var cardPend = document.getElementById('cardPend');
  if ((stats.pendentes||0) > 0) cardPend.style.borderColor = 'rgba(34,211,238,0.4)';
  else cardPend.style.borderColor = '';
}

/* ─── Carrega dados ── */
function loadData() {
  /* OPs separação */
  fetch('/api/almoxarifado/separacao')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      renderLotes(d.lotes || []);
      atualizarStats(d.stats || {});
    })
    .catch(function() {});

  /* Estoque do SQLite */
  fetch('/api/almoxarifado/estoque')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      renderEstoque(d);
    })
    .catch(function() {
      document.getElementById('painelEstoque').innerHTML =
        '<div class="empty-panel"><i class="fa-solid fa-plug-circle-xmark" style="color:#7f1d1d"></i><span>Erro ao carregar estoque</span></div>';
    });

  document.getElementById('tickerMsg').textContent =
    'Ultima atualizacao: ' + new Date().toLocaleTimeString('pt-BR') +
    ' | Pendentes: ' + document.getElementById('sPend').textContent +
    ' | Separando: ' + document.getElementById('sSep').textContent +
    ' | Criticos: ' + document.getElementById('sCritico').textContent;
}

/* ─── Init ── */
loadData();
setInterval(loadData, 20000);
setInterval(autoScrollTick, 40);
setTimeout(function() { location.reload(); }, 1800000);
</script>
</body>
</html>
