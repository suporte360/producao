<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Almoxarifado — SALUTEM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg:     #050e0f;
      --bg2:    #091618;
      --bg3:    #0d1e20;
      --border: rgba(255,255,255,0.06);
      --text:   #dff6f5;
      --muted:  #4a7070;
      --teal:   #0d9488;
      --cyan:   #22d3ee;
      --green:  #22c55e;
      --amber:  #f59e0b;
      --red:    #ef4444;
      --purple: #a855f7;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      display: flex; flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(13,148,136,0.08) 0, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(34,211,238,0.06) 0, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(90deg,#050f10 0%,#091e20 55%,#050f10 100%);
      border-bottom: 1px solid rgba(13,148,136,.35);
      padding: 0 24px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; position: relative; z-index: 2;
    }
    .h-left { display:flex; align-items:center; gap:14px; }
    .h-logo {
      width:42px; height:42px; border-radius:10px;
      background: var(--teal);
      display:flex; align-items:center; justify-content:center; font-size:1.3rem;
      box-shadow: 0 0 20px rgba(13,148,136,0.4);
    }
    .h-title { font-size:1.3rem; font-weight:800; letter-spacing:.02em; }
    .h-title span { color:var(--cyan); }
    .h-sub { font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:1px; }
    .h-clock .time { font-size:1.9rem; font-weight:700; font-family:'Courier New',monospace; color:var(--cyan); line-height:1; text-align:right; text-shadow: 0 0 12px rgba(34,211,238,0.4); }
    .h-clock .date { font-size:.7rem; color:var(--muted); margin-top:2px; text-align:right; text-transform:capitalize; }

    /* ── STATS ── */
    .stats-bar {
      display:grid; grid-template-columns:repeat(4,1fr);
      gap:8px; padding:10px 16px; flex-shrink:0;
      position: relative; z-index: 2;
    }
    .stat-card {
      background: var(--bg2); border:1px solid var(--border);
      border-radius:10px; padding:12px 16px;
      display:flex; align-items:center; gap:12px;
      transition: all .2s;
    }
    .stat-card.pulse-alert {
      animation: pulseCard 1.5s infinite;
    }
    @keyframes pulseCard {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); border-color: rgba(239,68,68,0.5); }
      50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); border-color: rgba(239,68,68,1); }
    }
    .stat-icon {
      width:40px; height:40px; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      font-size:1.1rem; flex-shrink:0;
    }
    .stat-num { font-size:1.8rem; font-weight:800; line-height:1; }
    .stat-lbl { font-size:.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

    /* ── PAINÉIS ── */
    .main-grid {
      flex:1; display:grid;
      grid-template-columns: 1.5fr 1fr;
      gap:10px; padding:0 16px 8px;
      overflow:hidden;
      position: relative; z-index: 2;
    }
    .panel {
      background: var(--bg2); border:1px solid var(--border);
      border-radius:12px; display:flex; flex-direction:column;
      overflow:hidden;
    }
    .panel-header {
      padding:10px 14px;
      font-size:.78rem; font-weight:800;
      text-transform:uppercase; letter-spacing:.07em;
      display:flex; justify-content:space-between; align-items:center;
      flex-shrink:0; border-bottom:1px solid var(--border);
    }
    .panel-body { flex:1; overflow-y:auto; }
    .panel-body::-webkit-scrollbar { width:4px; }
    .panel-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:3px; }

    .panel-estoque { border-top:3px solid var(--amber); }
    .panel-req     { border-top:3px solid var(--purple); }
    .panel-estoque .panel-header { color:var(--amber); }
    .panel-req     .panel-header { color:#c084fc; }

    /* ── TABELA ESTOQUE ── */
    .tbl-estoque { width:100%; border-collapse:collapse; table-layout:fixed; }
    .tbl-estoque thead th {
      padding:9px 12px; font-size:.65rem;
      text-transform:uppercase; letter-spacing:.06em;
      color:var(--muted); background:rgba(255,255,255,0.02);
      border-bottom:1px solid var(--border);
      white-space:nowrap; position:sticky; top:0; z-index:2;
      text-align: left;
    }
    .tbl-estoque thead th:nth-child(3),
    .tbl-estoque thead th:nth-child(4) { text-align:right; }
    .tbl-estoque tbody td {
      padding:9px 12px; font-size:.82rem;
      border-bottom:1px solid rgba(255,255,255,0.03);
      vertical-align:middle;
    }
    .tbl-estoque tbody tr:hover td { background:rgba(255,255,255,0.02); }

    .est-codigo { font-family:'Courier New',monospace; font-size:.78rem; color:#60a5fa; font-weight:600; }
    .est-desc { color:#e2e8f0; font-weight:500; }
    .est-saldo { font-weight:800; font-size:.95rem; }
    .est-min { color:var(--muted); font-size:.75rem; }

    .est-row.CRITICO td { background:rgba(239,68,68,0.08); border-left:3px solid var(--red); }
    .est-row.BAIXO td   { background:rgba(245,158,11,0.06); border-left:3px solid var(--amber); }
    .est-row.OK td      { border-left:3px solid rgba(34,197,94,0.3); }

    .est-status {
      font-size:.55rem; font-weight:800; text-transform:uppercase;
      padding:2px 8px; border-radius:6px; letter-spacing:.04em; white-space:nowrap;
    }
    .est-status.CRITICO { background:#7f1d1d; color:#fca5a5; }
    .est-status.BAIXO   { background:#713f12; color:#fde68a; }
    .est-status.OK      { background:#14532d; color:#86efac; }

    /* ── TABELA REQUISIÇÕES ── */
    table { width:100%; border-collapse:collapse; }
    thead th {
      padding:8px 12px; font-size:.6rem;
      text-transform:uppercase; letter-spacing:.06em;
      color:var(--muted); background:rgba(255,255,255,0.02);
      border-bottom:1px solid var(--border);
      white-space:nowrap; position:sticky; top:0;
    }
    tbody td {
      padding:10px 12px; font-size:.78rem;
      border-bottom:1px solid rgba(255,255,255,0.03);
      vertical-align:middle;
    }
    tbody tr:hover td { background:rgba(255,255,255,0.02); }
    tbody tr.urgente td { background:rgba(239,68,68,0.06); }

    .cnt-badge {
      background:rgba(255,255,255,0.1); color:var(--text);
      font-size:.65rem; font-weight:700;
      padding:2px 9px; border-radius:10px;
    }

    .op-dept { font-size:.6rem; padding:1px 7px; border-radius:7px; background:rgba(255,255,255,0.08); color:#94a3b8; font-weight:600; }
    .op-priority {
      font-size:.55rem; font-weight:800; text-transform:uppercase;
      padding:3px 8px; border-radius:8px; letter-spacing:.05em;
    }
    .op-priority.urgente { background:#7f1d1d; color:#fca5a5; }
    .op-priority.alta { background:#7c2d12; color:#fdba74; }
    .op-priority.media { background:#713f12; color:#fde68a; }
    .op-priority.baixa { background:#14532d; color:#86efac; }

    /* ── FOOTER ── */
    footer {
      height:30px; background:#040b0c;
      border-top:1px solid rgba(13,148,136,.25);
      display:flex; align-items:center;
      padding:0 16px; gap:12px; flex-shrink:0;
      position: relative; z-index: 2;
    }
    .live-dot { display:flex; align-items:center; gap:5px; font-size:.6rem; font-weight:700; color:#22c55e; white-space:nowrap; }
    .dot { width:6px; height:6px; border-radius:50%; background:#22c55e; animation:pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.75)} }
    .ticker-msg { font-size:.65rem; color:#1e4040; }

    .empty-panel {
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      height:100%; color:#173030; gap:8px; font-size:.82rem;
    }
    .empty-panel i { font-size:2.2rem; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="h-left">
    <div class="h-logo"><i class="fa-solid fa-warehouse"></i></div>
    <div>
      <div class="h-title">ALMOXARIFADO <span>Estoque</span></div>
      <div class="h-sub">Painel de Estoque e Requisicoes</div>
    </div>
  </div>
  <div class="h-clock">
    <div class="time" id="clock">00:00:00</div>
    <div class="date" id="dateStr">&#8212;</div>
  </div>
</header>

<!-- STATS -->
<div class="stats-bar">
  <div class="stat-card" id="cardCritico">
    <div class="stat-icon" style="background:rgba(239,68,68,.15);color:#f87171">
      <i class="fa-solid fa-circle-exclamation"></i>
    </div>
    <div>
      <div class="stat-num" style="color:#f87171" id="sCritico">0</div>
      <div class="stat-lbl">Critico</div>
    </div>
  </div>
  <div class="stat-card" id="cardBaixo">
    <div class="stat-icon" style="background:rgba(245,158,11,.15);color:#fbbf24">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <div>
      <div class="stat-num" style="color:#fbbf24" id="sBaixo">0</div>
      <div class="stat-lbl">Alerta (+25%)</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon" style="background:rgba(34,197,94,.15);color:#4ade80">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    <div>
      <div class="stat-num" style="color:#4ade80" id="sOk">0</div>
      <div class="stat-lbl">Estoque OK</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon" style="background:rgba(168,85,247,.15);color:#c084fc">
      <i class="fa-solid fa-bell"></i>
    </div>
    <div>
      <div class="stat-num" style="color:#c084fc" id="sReq">0</div>
      <div class="stat-lbl">Requisicoes</div>
    </div>
  </div>
</div>

<!-- PAINÉIS -->
<div class="main-grid">

  <!-- PAINEL 1: ESTOQUE (do SQLite sincronizado do ERP) -->
  <div class="panel panel-estoque">
    <div class="panel-header">
      <span><i class="fa-solid fa-boxes-stacked" style="margin-right:6px"></i>Estoque do Almoxarifado</span>
      <span class="cnt-badge" id="cntEstoque">0</span>
    </div>
    <div class="panel-body" id="painelEstoque">
      <div class="empty-panel">
        <i class="fa-solid fa-rotate fa-spin"></i>
        <span>Carregando estoque...</span>
      </div>
    </div>
  </div>

  <!-- PAINEL 2: Requisições pendentes -->
  <div class="panel panel-req">
    <div class="panel-header">
      <span><i class="fa-solid fa-bell" style="margin-right:6px"></i>Requisicoes dos Setores</span>
      <span class="cnt-badge" id="cntReqs">0</span>
    </div>
    <div class="panel-body">
      <table>
        <thead>
          <tr>
            <th>Req</th>
            <th>Material</th>
            <th>Qtd</th>
            <th>Setor</th>
            <th>Prioridade</th>
          </tr>
        </thead>
        <tbody id="tbodyReqs">
          <tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted)">
            <i class="fa-solid fa-rotate fa-spin" style="margin-right:6px"></i>Carregando...
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- FOOTER -->
<footer>
  <div class="live-dot"><div class="dot"></div> AO VIVO</div>
  <div class="ticker-msg" id="tickerMsg">Almoxarifado &#8212; Atualizacao automatica</div>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
    <span style="font-size:.55rem;color:var(--muted)">SYNC ERP</span>
    <div class="dot"></div>
  </div>
</footer>

<script>
/* ─── Relógio ── */
function tick() {
  var n = new Date();
  document.getElementById('clock').textContent = n.toLocaleTimeString('pt-BR');
  document.getElementById('dateStr').textContent = n.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}
setInterval(tick,1000); tick();

/* ─── Helpers ── */
function badgePrio(p) {
  var pp = (p||'media').toLowerCase();
  return '<span class="op-priority ' + pp + '">' + (p||'MEDIA').toUpperCase() + '</span>';
}

/* ─── Auto-scroll suave (fractional accumulator) ── */
var scrollCol = null;
var scrollAccum = 0;
var scrollSpeed = 0.4;
var scrollDir = 1;

function autoScrollTick() {
  if (!scrollCol) return;
  var maxScroll = scrollCol.scrollHeight - scrollCol.clientHeight;
  if (maxScroll <= 0) return;

  scrollAccum += scrollSpeed * scrollDir;
  if (Math.abs(scrollAccum) >= 1) {
    var step = Math.round(scrollAccum);
    scrollCol.scrollTop += step;
    scrollAccum = 0;
  }

  if (scrollCol.scrollTop >= maxScroll - 2) {
    scrollDir = -1;
  } else if (scrollCol.scrollTop <= 0) {
    scrollDir = 1;
  }
}

/* ─── Render Estoque ── */
function renderEstoque(dados) {
  var panel = document.getElementById('painelEstoque');
  var produtos = dados.produtos || [];
  var stats = dados.stats || {};

  document.getElementById('sCritico').textContent = stats.CRITICO || 0;
  document.getElementById('sBaixo').textContent   = stats.BAIXO || 0;
  document.getElementById('sOk').textContent      = stats.OK || 0;
  document.getElementById('cntEstoque').textContent = produtos.length;

  /* pulsar card critico */
  var cardCritico = document.getElementById('cardCritico');
  if ((stats.CRITICO || 0) > 0) cardCritico.classList.add('pulse-alert');
  else cardCritico.classList.remove('pulse-alert');

  if (!produtos.length) {
    panel.innerHTML = '<div class="empty-panel"><i class="fa-solid fa-circle-check" style="color:#14532d"></i><span>Estoque vazio ou sem dados</span></div>';
    return;
  }

  var html = '<table class="tbl-estoque"><thead><tr>' +
    '<th style="width:16%">Codigo</th>' +
    '<th style="width:42%">Produto</th>' +
    '<th style="width:14%;text-align:right">Saldo</th>' +
    '<th style="width:14%;text-align:right">Min</th>' +
    '<th style="width:14%">Status</th>' +
    '</tr></thead><tbody>';

  for (var i = 0; i < produtos.length; i++) {
    var p = produtos[i];
    var corSaldo = p.status === 'CRITICO' ? '#f87171' : p.status === 'BAIXO' ? '#fbbf24' : '#4ade80';

    html += '<tr class="est-row ' + p.status + '">' +
      '<td class="est-codigo">' + p.codigo + '</td>' +
      '<td class="est-desc">' + p.descricao + '</td>' +
      '<td class="est-saldo" style="text-align:right;color:' + corSaldo + '">' + p.saldo + '</td>' +
      '<td class="est-min" style="text-align:right">' + p.minimo + '</td>' +
      '<td><span class="est-status ' + p.status + '">' +
        (p.status === 'CRITICO' ? 'CRITICO' : p.status === 'BAIXO' ? 'ALERTA' : 'OK') +
      '</span></td>' +
      '</tr>';
  }

  html += '</tbody></table>';
  panel.innerHTML = html;

  /* ativar auto-scroll no painel de estoque */
  scrollCol = document.getElementById('painelEstoque');
}

/* ─── Render Requisições ── */
function renderReqs(reqs) {
  var tbody = document.getElementById('tbodyReqs');
  document.getElementById('cntReqs').textContent = reqs.length;
  if (!reqs.length) {
    tbody.innerHTML = '<tr><td colspan="5"><div class="empty-panel">' +
      '<i class="fa-solid fa-circle-check" style="color:#14532d"></i>' +
      '<span>Nenhuma requisicao pendente</span></div></td></tr>';
    return;
  }
  var html = '';
  for (var i = 0; i < reqs.length; i++) {
    var r = reqs[i];
    var prio = (r.prioridade_lote || '').toLowerCase();
    var urgente = prio === 'urgente' || prio === 'alta';
    html += '<tr class="' + (urgente ? 'urgente' : '') + '">' +
      '<td><span style="font-weight:700;color:#60a5fa">#' + r.lote_ordem + '</span><br><small style="color:var(--muted);font-size:.6rem">Req #' + r.id + '</small></td>' +
      '<td><div style="color:#e2e8f0">' + (r.material_descricao || '—').substring(0,32) + '</div></td>' +
      '<td><span style="font-weight:700">' + r.quantidade + '</span> <small style="font-size:.6rem;color:var(--muted)">' + (r.unidade_medida || '') + '</small></td>' +
      '<td>' + (r.departamento_solicitante ? '<span class="op-dept">' + r.departamento_solicitante + '</span>' : '—') + '</td>' +
      '<td>' + badgePrio(r.prioridade_lote) + '</td>' +
      '</tr>';
  }
  tbody.innerHTML = html;
}

/* ─── Carrega dados ── */
function loadData() {
  /* Estoque do SQLite */
  fetch('/api/almoxarifado/estoque')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      renderEstoque(d);
    })
    .catch(function() {
      document.getElementById('painelEstoque').innerHTML =
        '<div class="empty-panel"><i class="fa-solid fa-plug-circle-xmark" style="color:#7f1d1d"></i><span>Erro ao carregar estoque</span></div>';
    });

  /* Requisições pendentes */
  fetch('/api/requisicoes/pendentes')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var reqs = d.data || d.requisicoes || [];
      document.getElementById('sReq').textContent = reqs.length;
      renderReqs(reqs);
    })
    .catch(function() { renderReqs([]); });

  document.getElementById('tickerMsg').textContent =
    'Ultima atualizacao: ' + new Date().toLocaleTimeString('pt-BR') +
    ' | Criticos: ' + document.getElementById('sCritico').textContent +
    ' | Alertas: ' + document.getElementById('sBaixo').textContent +
    ' | OK: ' + document.getElementById('sOk').textContent;
}

/* ─── Init ── */
loadData();
setInterval(loadData, 30000);       /* atualiza dados a cada 30s */
setInterval(autoScrollTick, 40);    /* scroll suave */

/* Reload completo a cada 30 min */
setTimeout(function() { location.reload(); }, 1800000);
</script>
</body>
</html>
