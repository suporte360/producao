{% extends "base.html" %}
{% block title %}Erro {{ codigo }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div style="font-size:5rem;font-weight:900;color:#e0e0e0">{{ codigo }}</div>
    <h3 class="mt-2 text-muted">{{ erro }}</h3>
    <p class="text-muted">Ocorreu um problema ao processar sua solicitacao.</p>
    <div class="d-flex gap-2 justify-content-center mt-3">
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i>Voltar ao Inicio
        </a>
        <button onclick="history.back()" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Voltar
        </button>
    </div>
</div>
{% endblock %}
